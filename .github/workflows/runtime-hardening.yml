name: Runtime Hardening

on:
  pull_request:
    paths:
      - "taichi_vision/backend_config.py"
      - "taichi_vision/device_selection.py"
      - "taichi_vision/taichi_aot/**"
      - "taichi_vision/taichi_algorithm/aot_py/**"
      - ".github/workflows/runtime-hardening.yml"
  push:
    branches: [main]
    paths:
      - "taichi_vision/backend_config.py"
      - "taichi_vision/device_selection.py"
      - "taichi_vision/taichi_aot/**"
      - "taichi_vision/taichi_algorithm/aot_py/**"
      - ".github/workflows/runtime-hardening.yml"

permissions:
  contents: read

jobs:
  cpu-safe-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AOT_MODE: "1"
      AOT_ARCH: "cpu"
      PIXEL_REFINE_AOT_ARCH: "cpu"
      PIXEL_REFINE_BACKEND: "cpu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest "numpy>=2.0"

      - name: Compile runtime Python sources
        run: |
          python -m compileall -q \
            taichi_vision/backend_config.py \
            taichi_vision/device_selection.py \
            taichi_vision/taichi_aot

      - name: Run CPU-safe hardening regressions
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # The repository currently ships Windows and ARM Linux bridges, but
          # no x86_64 Linux bridge.  Keep this Linux job portable: native AOT
          # tests run in the target-runtime matrix, while this job verifies
          # the dependency boundary without importing the native package.
          root = Path("taichi_vision") / "taichi_algorithm"
          files = (
              root / "aot_api" / "__init__.py",
              root / "alignment" / "mtb.py",
              root / "alignment" / "ransac.py",
              root / "feature_matching" / "ofb.py",
              root / "optical_flow" / "lucas_kanade.py",
              root / "sfm" / "five_point_solver.py",
          )
          import_re = re.compile(r"^\\s*(?:from\\s+cv2\\s+import|import\\s+cv2)\\b", re.MULTILINE)
          for path in files:
              source = path.read_text(encoding="utf-8")
              if import_re.search(source):
                  raise SystemExit(f"OpenCV import leaked into core: {path}")
          facade = (root / "aot_api" / "__init__.py").read_text(encoding="utf-8")
          if "cv2." in facade:
              raise SystemExit("OpenCV call site leaked into the AOT facade")
          print(f"Checked {len(files)} core source files without importing native AOT")
          PY
