name: Runtime Hardening

on:
  pull_request:
    paths:
      - "taichi_vision/backend_config.py"
      - "taichi_vision/device_selection.py"
      - "taichi_vision/taichi_aot/**"
      - "taichi_vision/taichi_algorithm/aot_py/**"
      - ".github/workflows/runtime-hardening.yml"
  push:
    branches: [main]
    paths:
      - "taichi_vision/backend_config.py"
      - "taichi_vision/device_selection.py"
      - "taichi_vision/taichi_aot/**"
      - "taichi_vision/taichi_algorithm/aot_py/**"
      - ".github/workflows/runtime-hardening.yml"

permissions:
  contents: read

jobs:
  cpu-safe-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AOT_MODE: "1"
      AOT_ARCH: "cpu"
      PIXEL_REFINE_AOT_ARCH: "cpu"
      PIXEL_REFINE_BACKEND: "cpu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest "numpy>=2.0"

      - name: Compile runtime Python sources
        run: |
          python -m compileall -q \
            taichi_vision/backend_config.py \
            taichi_vision/device_selection.py \
            taichi_vision/taichi_aot

      - name: Run CPU-safe hardening regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          # The repository currently ships Windows and ARM Linux bridges, but
          # no x86_64 Linux bridge.  Keep this Linux job portable: native AOT
          # tests run in the target-runtime matrix, while this job verifies
          # the dependency boundary without importing the native package.
          tests = []
          core_boundary = Path(
              "taichi_vision/taichi_algorithm/aot_py/tests/"
              "test_core_dependency_boundary.py"
          )
          if core_boundary.is_file():
              tests.append(str(core_boundary))
          if not tests:
              print("No portable dependency-boundary tests are present on this ref yet.")
              raise SystemExit(0)
          subprocess.check_call([sys.executable, "-m", "pytest", "-q", *tests])
          PY
